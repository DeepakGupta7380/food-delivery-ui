<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>About Us | Swiggy Style</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

/* Navbar */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  border-bottom: 1px solid #eee;
}

.logo {
  color: #fc8019;
  font-size: 24px;
  font-weight: bold;
}

.navbar nav a {
  margin-left: 18px;
  text-decoration: none;
  color: #555;
  font-size: 14px;
}

.navbar nav a:hover {
  color: #fc8019;
}

/* About Section */
.about {
  text-align: center;
  padding: 80px 20px;
}

.about h1 {
  font-size: 32px;
  letter-spacing: 2px;
  margin-bottom: 20px;
}

.about p {
  max-width: 700px;
  margin: 0 auto 80px;
  color: #777;
  font-size: 16px;
  line-height: 1.6;
}

/* Services */
.services {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 60px 40px;
  max-width: 800px;
  margin: auto;
  align-items: center;
}

.service {
  text-align: center;
}

.icon {
  font-size: 32px;
  margin-bottom: 10px;
}

.service span {
  font-size: 14px;
  color: #555;
}

/* Center Swiggy Icon */
.center-logo {
  grid-column: 2 / 3;
}

.big-icon {
  width: 70px;
  height: 70px;
  margin: auto;
  border-radius: 50%;
  background-color: #fc8019;
  color: #fff;
  font-size: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}
  </style>
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="logo">Swiggy</div>
    <nav>
      <a href="#">About Swiggy</a>
      <a href="#">Our Businesses</a>
      <a href="#">Delivering For Everyone</a>
      <a href="#">Newsroom</a>
      <a href="#">Investor Relations</a>
      <a href="#">Sustainability</a>
      <a href="#">Contact Us</a>
    </nav>
  </header>

  <!-- About Section -->
  <section class="about">
    <h1>ABOUT US</h1>
    <p>
      Swiggy is a new-age consumer-first organization offering an easy-to-use
      convenience platform, accessible through a unified app.
    </p>

    <!-- Services -->
    <div class="services">
      <div class="service">
        <div class="icon">🍔</div>
        <span>Food</span>
      </div>

      <div class="service">
        <div class="icon">🛒</div>
        <span>Instamart</span>
      </div>

      <div class="service center-logo">
        <div class="big-icon">S</div>
      </div>

      <div class="service">
        <div class="icon">🍽️</div>
        <span>Dineout</span>
      </div>

      <div class="service">
        <div class="icon">🎉</div>
        <span>Scenes</span>
      </div>
    </div>
  </section>

</body>
</html>
